[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freightiq"
version = "2.2.0"
description = "Freight carrier query routing and retrieval system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FreightIQ Engineering Team" }
]
dependencies = [
    "langgraph>=0.1.0",
    "langchain>=0.1.0",
    "langchain-groq>=0.1.0",
    "langchain-community>=0.0.30",
    "langchain-openai>=0.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "streamlit>=1.30.0",
    "ddgs>=9.14.0",
    "python-dotenv>=1.0.0",
    "torch>=2.0.0",
    "tenacity>=8.2.0",
    "groq>=0.12.0",
    "numpy>=1.24.0",
    "tokenizers>=0.22.0,<=0.23.0",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.ruff.lint]
# BLE001 (blind `except Exception`) is accepted project-wide BY DESIGN:
# AGENTS.md mandates fail-soft fallback behavior (reranker cosine fallback,
# DDG fallback, FMCSA fallback, session-cache safety nets). Every such handler
# logs or surfaces the error; none swallow silently (S110/S112 are enforced).
ignore = [
    "BLE001",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "rag*", "config*", "utils*"]
