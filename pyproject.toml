[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freightiq"
version = "2.1.0"
description = "Agentic Freight Carrier Intelligence & Hybrid RAG System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FreightIQ Engineering Team" }
]
dependencies = [
    "langgraph>=0.1.0",
    "langchain>=0.1.0",
    "langchain-groq>=0.1.0",
    "langchain-community>=0.0.30",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "streamlit>=1.30.0",
    "duckduckgo-search>=5.0.0",
    "python-dotenv>=1.0.0",
    "torch>=2.0.0",
    "tenacity>=8.2.0",
    "numpy>=1.24.0",
    "tokenizers>=0.22.0,<=0.23.0",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "rag*", "config*"]
