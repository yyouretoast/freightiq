name: FreightIQ Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Seed Database
        run: |
          python scripts/seed_db.py
      - name: Run System Verification
        run: |
          python -m tests.verify_system
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Run Retrieval Benchmark
        run: |
          python -m tests.evaluate_retrieval
      - name: Run Concurrency Test
        run: |
          python -m tests.stress_test_concurrency
      - name: Run Agent Trajectory Evaluation (When Secret Configured)
        if: ${{ env.GROQ_API_KEY != '' }}
        run: |
          python -m tests.evaluate_agent_trajectories
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
