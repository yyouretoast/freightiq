name: FreightIQ Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Seed SQLite database and ChromaDB vector index
      run: |
        python scripts/seed_db.py

    - name: Verify system & domain tools
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python -m tests.verify_system

    - name: Run retrieval benchmark evaluation
      run: |
        python -m tests.evaluate_retrieval

    - name: Run concurrency stress test
      run: |
        python -m tests.stress_test_concurrency

    - name: Run agent trajectory evaluation
      if: env.GROQ_API_KEY != ''
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python -m tests.evaluate_agent_trajectories
