name: Sync to Hugging Face Spaces

on:
  workflow_run:
    workflows: ["FreightIQ Verification CI"]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://yyouretoast:$HF_TOKEN@huggingface.co/spaces/yyouretoast/freightiq main:main --force
